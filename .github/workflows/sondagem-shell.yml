name: Sondagem dos shells (spike 4)

# Roda a sondagem do motor dentro do Electron e do Tauri em cada sistema e publica as tabelas
# no resumo da execução. É informativa: só falha se um shell não entregar o relatório.
on:
  pull_request:
    paths:
      - 'spikes/**'
      - 'apps/playground/**'
      - 'packages/engine/**'
      - 'scripts/rodar-sondagem.ts'
      - 'scripts/gerar-amostras-codecs.ts'
      - '.github/workflows/sondagem-shell.yml'
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/shell-tauri/src-tauri

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Só os plugins do GStreamer que um Ubuntu desktop traz de fábrica.
          sudo apt-get install -y ffmpeg xvfb pulseaudio libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          pulseaudio --start --exit-idle-time=-1
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures:codecs
      - run: pnpm --filter @djmixer/playground build
      # O binário vem direto do release do Electron, sem passar pelo instalador do pacote.
      - name: Baixar o Electron
        shell: bash
        run: |
          version=$(node -p "require('./spikes/shell-electron/package.json').devDependencies.electron")
          case "$RUNNER_OS" in
            macOS) platform=darwin; bin=Electron.app/Contents/MacOS/Electron ;;
            Linux) platform=linux; bin=electron ;;
            Windows) platform=win32; bin=electron.exe ;;
          esac
          arch=$(node -p process.arch)
          curl -fsSL -o "$RUNNER_TEMP/electron.zip" \
            "https://github.com/electron/electron/releases/download/v$version/electron-v$version-$platform-$arch.zip"
          dir="$RUNNER_TEMP/electron"
          if [ "$RUNNER_OS" = Windows ]; then 7z x -y -o"$dir" "$RUNNER_TEMP/electron.zip" > /dev/null
          else unzip -q "$RUNNER_TEMP/electron.zip" -d "$dir"; fi
          echo "ELECTRON_BIN=$dir/$bin" >> "$GITHUB_ENV"
      - run: pnpm --filter @djmixer/spike-shell-tauri compile

      - name: Sondagem no Electron
        shell: bash
        run: |
          run="node scripts/rodar-sondagem.ts probe-electron.json --"
          electron="$ELECTRON_BIN spikes/shell-electron"
          if [ "$RUNNER_OS" = Linux ]; then $run xvfb-run -a $electron --no-sandbox
          else $run $electron; fi
      - name: Sondagem no Tauri
        shell: bash
        run: |
          run="node scripts/rodar-sondagem.ts probe-tauri.json --"
          bin=spikes/shell-tauri/src-tauri/target/debug/djmixer-spike-shell-tauri
          if [ "$RUNNER_OS" = Linux ]; then $run xvfb-run -a $bin
          else $run $bin; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sondagem-${{ matrix.os }}
          path: probe-*.json
